[project]
name = "serana-agent"
version = "0.1.0"
description = "Local companion agent: Serana persona adapter on Qwen3-8B with an MCP tool server, memory, and skills."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "chromadb>=0.5.0",
    "jsonschema>=4.23.0",
    "langsmith>=0.2.0",
    "mcp>=2.3.0",
    "mlx-lm>=0.20.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "openai>=1.50.0",
    "prompt-toolkit>=3.0.0",
    "pyfiglet>=1.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.scripts]
serana = "serana_agent.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
# Only for scripts/merge_adapter.py (bf16 merge used as an experiment-2 comparison).
convert = [
    "peft>=0.13.0",
    "safetensors>=0.4.0",
    "torch>=2.4.0",
    "transformers>=4.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serana_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "model: needs local model weights in the Hugging Face cache",
    "docker: needs a running Docker daemon",
]
